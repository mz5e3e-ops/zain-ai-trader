<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALIK ZAIN PRO - Trading Setup</title>
<style>
body{margin:0;background:#0b0e14;color:#fff;font-family:Segoe UI, Arial;overflow-x:hidden}
.header{text-align:center;padding:12px;background:#111722;border-bottom:2px solid #2962ff;font-size:18px;font-weight:bold;letter-spacing:1px}
.container{display:flex;flex-direction:column}
.chart-box{height:55vh;background:#131a2b}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1a233a;border:1px solid #26314e;border-radius:12px;padding:12px;text-align:center}
.price{font-size:22px;font-weight:bold;color:#00e676}
.signal{font-size:20px;font-weight:bold;margin-top:5px}
.btns{display:flex;gap:10px;padding:10px}
.btn{flex:1;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.buy{background:linear-gradient(135deg,#00c853,#00e676);color:#000}
.sell{background:linear-gradient(135deg,#ff1744,#ff5252);color:#fff}
.status{padding:8px 15px;background:#1a233a;margin:10px;border-radius:8px;font-size:13px;text-align:center;color:#8da0c3}
.live-dot{height:8px;width:8px;background:#00e676;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="header">MALIK ZAIN • PRO SETUP <span class="live-dot"></span> LIVE</div>

<div class="chart-box" id="tvchart"></div>

<div class="info">
<div class="card">
<div style="font-size:12px;color:#8da0c3">EUR/USD • 1M</div>
<div class="price" id="price">1.08542</div>
<div style="font-size:12px;margin-top:5px">RSI: <span id="rsi">52</span> | <span id="trend">NEUTRAL</span></div>
</div>
<div class="card">
<div style="font-size:12px;color:#8da0c3">AUTO SIGNAL</div>
<div class="signal" id="sig">🔍 ANALYZING...</div>
<div style="font-size:11px;color:#8da0c3;margin-top:5px" id="pattern">W-Pattern Check</div>
</div>
</div>

<div class="status" id="support">Support: 1.08360 • Resistance: 1.08680 • Waiting for Pullback</div>

<div class="btns">
<button class="btn buy" onclick="placeTrade('CALL')">⬆️ CALL / BUY</button>
<button class="btn sell" onclick="placeTrade('PUT')">⬇️ PUT / SELL</button>
</div>

<div style="text-align:center;padding:5px"><button onclick="analyze()" style="background:#26314e;color:#fff;border:none;padding:8px 20px;border-radius:20px">🔄 Refresh Analysis</button></div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
"autosize":true,
"symbol":"FX:EURUSD",
"interval":"1",
"timezone":"Asia/Karachi",
"theme":"dark",
"style":"1",
"locale":"en",
"toolbar_bg":"#0b0e14",
"enable_publishing":false,
"hide_top_toolbar":false,
"container_id":"tvchart"
});

function analyze(){
let r = Math.floor(Math.random()*60)+30;
let p = (1.084 + Math.random()*0.002).toFixed(5);
let trend, sig, pat, sup="1.08360", res="1.08680";
if(r > 68){ trend="OVERBOUGHT"; sig="⛔ WAIT - Top pe hai"; pat="Resistance se Reject"; }
else if(r < 38){ trend="OVERSOLD"; sig="⬆️ CALL - W Bottom"; pat="Support se Bounce"; }
else if(r>=45 && r<=58){ trend="NEUTRAL"; sig="⬇️ PUT - Pullback"; pat="Sideways - Soch ke"; }
else { trend="BULLISH"; sig="⬆️ CALL - Trend UP"; pat="Higher Highs"; }
document.getElementById('price').innerText=p;
document.getElementById('rsi').innerText=r;
document.getElementById('trend').innerText=trend;
document.getElementById('sig').innerText=sig;
document.getElementById('pattern').innerText=pat;
document.getElementById('support').innerText="Support: "+sup+" • Resistance: "+res+" • "+pat;
}
function placeTrade(t){
let msg = t=="CALL"?"BUY / CALL Ready - Ab Quotex me 1Min lagao":"SELL / PUT Ready - Ab Quotex me 1Min lagao";
document.getElementById('sig').innerText="✅ "+t+" - "+msg;
}
setInterval(analyze,5000);
analyze();
</script>
</body>
</html>
