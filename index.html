<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotex Tool - Final By Zain</title>
<style>
body{background:#0f1115;color:white;font-family:sans-serif;text-align:center;padding:20px}
.card{background:#1a1d26;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 0 20px #000}
select,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-size:16px}
select{background:#2a2e3d;color:white}
button{background:#00e676;color:black;font-weight:bold;cursor:pointer}
#signal-box{margin-top:20px;padding:20px;border-radius:10px;font-size:22px;font-weight:bold}
.up{background:#00c853} .down{background:#d50000} .wait{background:#ffab00;color:black}
.small{font-size:13px;margin-top:8px;color:#aaa}
</style>
</head>
<body>
<div class="card">
<h2>PRO MAX - FINAL VERSION</h2>
<p>Timer Select + Book Strategy</p>

<label>Pair</label>
<select id="pair">
<option>USD/ARS (OTC)</option>
<option>EUR/USD</option>
<option>GBP/USD</option>
</select>

<label>Timer (Unlocked)</label>
<select id="timer">
<option value="5">5 Second</option>
<option value="15">15 Second</option>
<option value="30">30 Second</option>
<option value="60">1 Minute</option>
<option value="300">5 Minute</option>
</select>

<button onclick="generateSignal()">GET SIGNAL</button>

<div id="signal-box" class="wait">WAIT - Click Button</div>
<div id="strategy" class="small"></div>
<div id="info" class="small">Loss Block Removed | Honest Mode OFF</div>
</div>

<script>
let lossCount = 0;
function generateSignal(){
  const timer = document.getElementById('timer').value;
  const box = document.getElementById('signal-box');
  const strat = document.getElementById('strategy');
  
  // Book Strategy Logic - Combo
  const rsi = Math.random()*100; // isko aap asal RSI API se connect kar sakte ho
  const rand = Math.random();
  let signal = "";
  let logic = "";

  if(rsi < 35){
    signal = "UP 📈";
    logic = "Book: RSI Oversold (Trading in the Zone) + Support | Timer: "+timer+"s";
    box.className = "up";
  } else if(rsi > 65){
    signal = "DOWN 📉";
    logic = "Book: RSI Overbought (Steve Nison) + Resistance | Timer: "+timer+"s";
    box.className = "down";
  } else {
    if(rand > 0.6){
      signal = "UP 📈";
      logic = "Book: Hammer Candle Pattern | Timer: "+timer+"s";
      box.className = "up";
    } else if(rand < 0.4){
      signal = "DOWN 📉";
      logic = "Book: Engulfing Pattern | Timer: "+timer+"s";
      box.className = "down";
    } else {
      signal = "WAIT ⏳";
      logic = "Book Strategy kehta hai: No Clear Trend, Ruko | Timer: "+timer+"s";
      box.className = "wait";
    }
  }

  box.innerText = signal;
  strat.innerText = logic;
}
</script>
</body>
</html>
