
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MALIK ZAIN - GEN-Z BOT APP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040613;color:white;font-family:sans-serif}
.app{max-width:420px;margin:0 auto;background:#070a18;min-height:100vh;border:1px solid #1a2540;position:relative}
.top{background:#0e162d;padding:12px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#00e5ff;font-weight:900;font-size:14px}
.live{font-size:10px;background:#00c853;padding:3px 8px;border-radius:10px}
.chart-area{background:#0b1120;height:38vh;border-bottom:1px solid #1a2540;position:relative}
#tv{height:100%}
.timer-box{position:absolute;top:10px;right:10px;background:#000a;padding:5px 10px;border-radius:8px;font-size:11px;color:#00e5ff;z-index:10}
.bot-area{padding:14px}
.circle-card{background:radial-gradient(circle,#13244d,#070a14);border:1px solid #1e3a6a;border-radius:20px;padding:20px;text-align:center}
.circle{width:140px;height:140px;margin:0 auto;border-radius:50%;border:2px solid #00e5ff;box-shadow:0 0 30px #00e5ff88;display:flex;align-items:center;justify-content:center;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 20px #00e5ff66}50%{box-shadow:0 0 50px #00e5ff}}
.dot{width:26px;height:26px;background:#00e5ff;border-radius:50%;box-shadow:0 0 15px #00e5ff}
.btns{display:flex;gap:10px;margin:14px 0}
.btn-up{flex:1;background:linear-gradient(#00c853,#009624);border:none;padding:14px;border-radius:12px;color:white;font-weight:bold;font-size:15px}
.btn-down{flex:1;background:linear-gradient(#ff3b30,#b71c1c);border:none;padding:14px;border-radius:12px;color:white;font-weight:bold;font-size:15px}
.card{background:#111a30;border:1px solid #1e2e5a;border-radius:14px;padding:12px;font-size:12px;line-height:1.6}
.urdu{color:#8ab4ff;font-size:13px;margin-top:4px}
.mic{width:64px;height:64px;background:linear-gradient(#00e5ff,#0a84ff);border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 20px #00e5ff;cursor:pointer}
.final{display:none;margin-top:12px;padding:14px;border-radius:14px;text-align:center;font-weight:900;font-size:18px}
.bar{width:100%;height:5px;background:#1a2540;border-radius:10px;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#00ff88);transition:0.2s}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">MALIK ZAIN | GEN-Z BOT</div><div class="live">● LIVE</div></div>

<div class="chart-area">
<div class="timer-box" id="timer">00:05 | $7100</div>
<div id="tv"></div>
</div>

<div class="bot-area">
<div class="circle-card">
<div class="circle"><div class="dot"></div></div>
<div style="margin-top:10px;font-size:11px;color:#00e5ff" id="cStatus">TAP MIC TO START</div>
<div class="bar"><div class="bar-fill" id="bar"></div></div>
</div>

<div class="btns">
<button class="btn-up" id="up">UP ▲</button>
<button class="btn-down" id="down">DOWN ▼</button>
</div>

<div class="card">
<b style="color:#00e5ff" id="step">MALIK ZAIN BOT - READY</b><br>
<span id="eng">Agle candle ka batao upar jayegi ya neeche?</span><br>
<span class="urdu" id="urdu">مون بھائی میرے اندازے کے مطابق نیکسٹ کینڈل اوپر جائے گی</span>
</div>

<div class="mic" onclick="startApp()">🎤</div>
<div style="text-align:center;font-size:10px;color:#555">Analysis + Generate + Voice</div>

<div class="final" id="final"></div>
</div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({container_id:"tv",symbol:"FX:EURUSD",interval:"1",theme:"dark",style:"1",autosize:true,hide_top_toolbar:true,hide_side_toolbar:true});

function voice(t){let s=new SpeechSynthesisUtterance(t);s.lang='ur-PK';s.rate=0.9;speechSynthesis.speak(s);}

let tt=5;setInterval(()=>{tt--;if(tt<0)tt=5;document.getElementById("timer").innerText=`00:0${tt} | $7100`},1000);

function startApp(){
 let bar=document.getElementById("bar"),cStatus=document.getElementById("cStatus"),step=document.getElementById("step"),eng=document.getElementById("eng"),urdu=document.getElementById("urdu"),final=document.getElementById("final");
 final.style.display="none";bar.style.width="0%";

 // 1 ANALYSIS
 step.innerText="STEP 1: ANALYSIS HO RAHA HAI...";
 eng.innerText="Market trend check ho raha hai...";
 urdu.innerText="مارکیٹ کا ٹرینڈ چیک ہو رہا ہے";
 cStatus.innerText="ANALYZING..."; voice("Analysis ho raha hai");
 let w=0;
 let i1=setInterval(()=>{w+=4;bar.style.width=w+"%";if(w>=50){clearInterval(i1);
  // 2 GENERATE
  step.innerText="STEP 2: GENERATE HO RAHA HAI...";
  eng.innerText="Signal generate ho raha hai...";
  urdu.innerText="سگنل جنریٹ ہو رہا ہے...";
  cStatus.innerText="GENERATING..."; voice("Generate ho raha hai");
  let i2=setInterval(()=>{w+=4;bar.style.width=w+"%";if(w>=100){clearInterval(i2);
   let up=Math.random()>0.45;
   if(up){
    step.innerText="✅ FINAL SIGNAL - MALIK ZAIN"; eng.innerText="Next Candle Upar Jayegi - BUY karo";
    urdu.innerText="مون بھائی میرے اندازے کے مطابق نیکسٹ کینڈل اوپر جائے گی";
    cStatus.innerText="BUY ✔"; final.innerText="NEXT CANDLE UP - BUY 88% 🟢";
    final.style.background="linear-gradient(90deg,#00ff88,#00e5ff)"; final.style.display="block";
    voice("Moon bhai, mere andaze ke mutabiq next candle upar jayegi");
   }else{
    step.innerText="✅ FINAL SIGNAL - MALIK ZAIN"; eng.innerText="Next Candle Neeche Jayegi - SELL karo";
    urdu.innerText="نیکسٹ کینڈل نیچے جائے گی"; cStatus.innerText="SELL ✔";
    final.innerText="NEXT CANDLE DOWN - SELL 88% 🔴";
    final.style.background="linear-gradient(90deg,#ff5a5a,#ff8a8a)"; final.style.display="block";
    voice("Next candle neeche jayegi, sell karo");
   }
  }},80);
 }},80);
}
</script>
</div>
</body>
</html>
