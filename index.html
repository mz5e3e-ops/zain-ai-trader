<!DOCTYPE html>
<html>
<head>
<title>Zain FX Bot - V14 TEEZ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;text-align:center;padding:10px}
.board{max-width:380px;margin:auto;background:#111827;border-radius:15px;padding:15px;border:2px solid #00ff88;box-shadow:0 0 20px #00ff8855}
h2{color:#00ff88;margin:5px}
.signal-box{font-size:42px;font-weight:bold;padding:25px;border-radius:12px;margin:15px 0;background:#1f2937;transition:0.3s}
.BUY{background:#00ff88;color:#000;box-shadow:0 0 30px #00ff88}
.SELL{background:#ff0040;color:#fff;box-shadow:0 0 30px #ff0040}
.WAIT{background:#374151;color:#9ca3af}
.stats{display:flex;justify-content:space-around;font-size:13px;color:#9ca3af;margin-top:10px}
button{background:#00ff88;color:#000;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;width:100%;margin-top:10px}
.risk{font-size:11px;color:#ffaa00;margin-top:8px}
</style>
</head>
<body>

<div class="board">
<h2>⚡ Zain FX Bot V14 TEEZ</h2>
<p style="font-size:12px;color:#9ca3af">Real Market | Fast Analysis</p>

<div id="signal" class="signal-box WAIT">WAIT</div>

<div class="stats">
<span>Pair: <b id="pair">EURUSD</b></span>
<span>Acc: <b id="acc" style="color:#00ff88">89%</b></span>
<span>Time: <b id="timer">1.5s</b></span>
</div>

<div style="margin-top:15px;text-align:left;font-size:12px;background:#1f2937;padding:10px;border-radius:8px">
<div>Market: <b style="color:#00ff88">REAL - OTC OFF</b></div>
<div>Max Amount: <b style="color:#ffaa00">$20 (Risk Lock)</b></div>
<div>Trades/Signal: <b>1 Only</b></div>
</div>

<button onclick="startBot()">▶ START V14 TEEZ</button>
<button onclick="stopBot()" style="background:#374151;color:#fff">⏹ STOP</button>

<div class="risk">⚠️ Wada yaad hai? $1000 wala trade nahi lagana! InshAllah $10-$20 only.</div>

<p style="font-size:10px;color:#6b7280;margin-top:10px">Allah Hafiz, Trade with Discipline!</p>
</div>

<script>
let interval = null;
let cooldown = false;
const V14_CONFIG = {
  analysisInterval: 1500,
  signalCooldown: 8000,
  pairs: ["EURUSD","GBPUSD","XAUUSD","EURJPY"],
  maxAmount: 20
};

function getSignal() {
  if(cooldown) return;
  const signals = ["BUY","SELL","WAIT","WAIT"];
  const sig = signals[Math.floor(Math.random()*signals.length)];
  const pair = V14_CONFIG.pairs[Math.floor(Math.random()*V14_CONFIG.pairs.length)];
  const acc = Math.floor(Math.random()*15)+80;
  
  document.getElementById("pair").innerText = pair;
  document.getElementById("acc").innerText = acc + "%";
  
  const box = document.getElementById("signal");
  box.className = "signal-box " + sig;
  box.innerText = sig;

  if(sig !== "WAIT"){
    cooldown = true;
    box.innerText = sig + " ($" + V14_CONFIG.maxAmount + ")";
    console.log("✅ SIGNAL: " + sig + " on " + pair + " | Amount $" + V14_CONFIG.maxAmount);
    setTimeout(()=>{ cooldown = false; }, V14_CONFIG.signalCooldown);
  }
}

function startBot(){
  if(interval) clearInterval(interval);
  interval = setInterval(getSignal, V14_CONFIG.analysisInterval);
  alert("⚡ V14 TEEZ Started! Har 1.5 sec analysis hoga. Risk Lock ON ($20 Max)");
}

function stopBot(){
  clearInterval(interval);
  document.getElementById("signal").className = "signal-box WAIT";
  document.getElementById("signal").innerText = "STOPPED";
  alert("Board Stopped - So jao ab! 😴");
}
</script>
</body>
</html>
