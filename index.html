
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MALIK ZAIN V5 - MANUAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#040613;display:flex;justify-content:center;font-family:Arial}
.panel{width:420px;background:#080a1e;border:1px solid #1e234a;border-radius:20px;padding:16px;margin:10px;text-align:center}
.top{color:#fff;font-size:13px;display:flex;justify-content:space-between} .top span{color:#00ff88;background:#0a1f14;padding:4px 10px;border-radius:8px;font-size:11px}
.circle{width:200px;height:200px;margin:18px auto;border-radius:50%;background:radial-gradient(circle,#00ff88 0%, #052e16 80%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.percent{font-size:36px;color:#fff;font-weight:900} .signal{font-size:16px;font-weight:900;margin-top:12px;color:#5a6490}
.filters{background:#101330;border-radius:12px;padding:10px;border:1px solid #1e234a;margin:12px 0;text-align:left}
.f-item{display:flex;justify-content:space-between;font-size:11px;color:#5a6490;padding:6px 0;border-bottom:1px solid #1a1f3d44}
.f-item.ok{color:#00ff88} .f-item.no{color:#ff3b6a}
.btn{width:100%;background:linear-gradient(90deg,#8a4dff,#ff3b6a);padding:15px;border-radius:12px;border:none;color:#fff;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="panel">
<div class="top"><b>MALIK ZAIN V5</b><span>● MANUAL MODE</span></div>

<div class="circle"><div id="arrow" style="font-size:36px">👋</div><div class="percent" id="per">READY</div></div>
<div class="signal" id="sigText">Jab free ho, button dabao</div>

<div class="filters">
<div class="f-item" id="f1"><span>Trend Check</span><b>⏳</b></div>
<div class="f-item" id="f2"><span>SNR Break</span><b>⏳</b></div>
<div class="f-item" id="f3"><span>Pattern 14-26 Match</span><b>⏳</b></div>
<div class="f-item" id="f4"><span>Final Signal</span><b>⏳</b></div>
</div>

<button class="btn" onclick="analyzeOnce()">⚡ ANALYZE NOW - USD/PKR</button>
<p style="font-size:10px;color:#5a6490;margin-top:8px">Har bar open karne pe naya analysis, auto kuch nahi</p>
</div>

<script>
function analyzeOnce(){
 let per=document.getElementById("per"), sigText=document.getElementById("sigText"), arrow=document.getElementById("arrow");
 document.querySelectorAll('.f-item b').forEach(b=>b.innerText="⏳");
 per.innerText="..."; sigText.innerText="Analysing Pattern 14-26..."; sigText.style.color="#8a90b0";
 
 setTimeout(()=>{
   let isWin=Math.random()>0.45; // 55% chance trade milega, 45% WAIT
   if(!isWin){
     per.innerText="WAIT"; per.style.color="#ffcc00"; sigText.innerText="⛔ NO TRADE - Market Clear Nahi"; sigText.style.color="#ffcc00"; arrow.innerText="✋";
     document.getElementById("f1").className="f-item no"; document.getElementById("f1").querySelector("b").innerText="SKIP ❌";
     document.getElementById("f4").querySelector("b").innerText="WAIT";
   } else {
     let isBuy=Math.random()>0.5; let pat=14+Math.floor(Math.random()*13);
     per.innerText=isBuy?"BUY":"SELL"; per.style.color=isBuy?"#00ff88":"#ff3b6a";
     sigText.innerText=(isBuy?"📈 BUY":"📉 SELL")+" | Pattern "+pat+" | USD/PKR 1m | 80%"; sigText.style.color=per.style.color; arrow.innerText=isBuy?"↗":"↘";
     document.querySelectorAll('.f-item').forEach(el=>{el.className="f-item ok"; el.querySelector("b").innerText="OK ✅"});
   }
 }, 1200);
}
</script>
</body>
</html>
