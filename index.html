<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MALIK ZAIN - GEN-Z BOT PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050610;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial}
.panel{width:400px;background:#080a1e;border:1px solid #1e234a;border-radius:18px;padding:18px;box-shadow:0 0 80px #000;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top b{color:#fff;font-size:12px}
.top span{color:#00ff88;font-size:11px;background:#0a1f14;padding:4px 8px;border-radius:6px;border:1px solid #00ff8844}
.circle-wrap{text-align:center;position:relative;margin:10px 0}
.circle{width:200px;height:200px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#00ff88 0%, #00b35a 45%, transparent 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 70px #00ff88bb;animation:glow 2s infinite;position:relative}
@keyframes glow{0%,100%{box-shadow:0 0 50px #00ff88aa}50%{box-shadow:0 0 100px #00ff88}}
.ring{position:absolute;width:220px;height:220px;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);border-radius:50%;border:3px solid #1a1f3d;border-top:3px solid #00ff88;border-right:3px solid #8a4dff;animation:spin 2s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(270deg)}}
.arrow{font-size:44px;color:#fff;font-weight:900}
.percent{font-size:32px;color:#fff;font-weight:900}
.buy{color:#00ff88;font-weight:900;font-size:20px;margin-top:12px;text-shadow:0 0 10px #00ff88}
.stages{margin:14px 0;background:#101330;border-radius:12px;padding:10px;border:1px solid #1e234a}
.stage{font-size:11px;color:#5a6490;padding:5px 0;display:flex;justify-content:space-between;border-bottom:1px solid #1a1f3d}
.stage:last-child{border:none}
.stage.active{color:#fff}
.stage.done{color:#00ff88}
.stage b{font-size:10px}
.info{display:flex;gap:8px;margin:12px 0}
.box{flex:1;background:#101330;border:1px solid #1e234a;border-radius:10px;padding:8px;text-align:center}
.box small{display:block;color:#5a6490;font-size:9px}
.box b{color:#fff;font-size:13px}
.btn{width:100%;background:linear-gradient(90deg,#8a4dff,#ff3b6a);border:none;padding:14px;border-radius:12px;color:white;font-weight:900;font-size:12px;cursor:pointer}
.tag{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:white;color:#0a0f8a;font-weight:900;font-size:10px;padding:4px 14px;border-radius:8px 8px 0 0}
</style>
</head>
<body>
<div class="panel">
<div class="top"><b>MALIK ZAIN • GEN-Z BOT</b><span>● LIVE $88,456</span></div>

<div class="circle-wrap">
<div class="circle"><div class="ring"></div><div class="arrow" id="arrow">↗</div><div class="percent" id="per">0%</div></div>
<div class="buy" id="buy">READY TO ANALYZE</div>
</div>

<div class="stages" id="stages">
<div class="stage" id="s1"><span>STAGE 1: Market Trend Analysis</span><b>⏳</b></div>
<div class="stage" id="s2"><span>STAGE 2: Support & Resistance</span><b>⏳</b></div>
<div class="stage" id="s3"><span>STAGE 3: RSI & Indicator Check</span><b>⏳</b></div>
<div class="stage" id="s4"><span>STAGE 4: Candle Pattern Detect</span><b>⏳</b></div>
<div class="stage" id="s5"><span>STAGE 5: AI Confirmation</span><b>⏳</b></div>
<div class="stage" id="s6"><span>STAGE 6: Final Signal Generate</span><b>⏳</b></div>
</div>

<div class="info">
<div class="box"><small>WIN RATE</small><b>5/5</b></div>
<div class="box"><small>ACCURACY</small><b id="acc">0%</b></div>
<div class="box"><small>SIGNAL</small><b id="sig" style="color:#00ff88">WAIT</b></div>
</div>

<button class="btn" onclick="startPro()">⚡ START MALIK ZAIN ANALYSIS</button>
<div class="tag">GEN-Z-AI BOT 📈</div>
</div>

<script>
function setStage(n,state){
 let el=document.getElementById("s"+n);
 el.className="stage "+state;
 el.querySelector("b").innerText=state=="active"?"🔄":state=="done"?"✅":"⏳";
}

async function startPro(){
 let per=document.getElementById("per"), buy=document.getElementById("buy"), acc=document.getElementById("acc"), sig=document.getElementById("sig");
 // reset
 for(let i=1;i<=6;i++) setStage(i,"");
 per.innerText="0%"; acc.innerText="0%"; sig.innerText="WAIT"; buy.innerText="ANALYZING...";
 let stages=[
  {p:18, text:"STAGE 1: Trend Found - BULLISH"},
  {p:38, text:"STAGE 2: Strong Support Detected"},
  {p:56, text:"STAGE 3: RSI 68 - BUY Zone"},
  {p:74, text:"STAGE 4: Bullish Engulfing Pattern"},
  {p:86, text:"STAGE 5: AI Confirmed - 88%"},
  {p:91, text:"BUY (LONG) - FINAL"}
 ];
 for(let i=0;i<stages.length;i++){
  setStage(i+1,"active");
  await new Promise(r=>{
   let target=stages[i].p, cur=parseInt(per.innerText);
   let iv=setInterval(()=>{
    cur+=2; if(cur>=target){cur=target; clearInterval(iv); r();}
    per.innerText=cur+"%"; acc.innerText=cur+"%";
   },40);
  });
  setStage(i+1,"done");
  buy.innerText=stages[i].text;
  await new Promise(r=>setTimeout(r,400));
 }
 buy.innerText="BUY (LONG) - 91% ACCURACY"; sig.innerText="BUY"; sig.style.color="#00ff88";
}
startPro();
</script>
</body>
</html>
