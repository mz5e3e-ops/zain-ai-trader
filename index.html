<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard</title>
<style>
body{font-family:sans-serif; background:#0e0e10; color:white; margin:0; padding:10px;}
.card{background:#1e1e22; border-radius:12px; padding:12px; margin-bottom:10px; border:1px solid #333;}
.green{color:#00d084;} .red{color:#ff4d4d;}
.btn{width:48%; padding:14px; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer;}
.btn-buy{background:#00d084; color:black;}
.btn-sell{background:#ff4d4d; color:white;}
.status{font-size:20px; font-weight:bold; text-align:center; padding:15px; border-radius:10px; background:#2a2a2e; margin:10px 0;}
.support-box{border:2px dashed #00d084; padding:10px; border-radius:8px; text-align:center;}
</style>
</head>
<body>
<h2>📊 پریکٹس ڈیش بورڈ</h2>
<div class="card">
<div class="status" id="status">چارٹ لوڈ ہو رہا ہے...</div>
<div class="support-box">
<p>زمین (Support): <b>1.12290</b></p>
<p>موجودہ قیمت: <span id="price">1.12315</span></p>
<p id="hint">مارکیٹ زمین کے قریب ہے، غور سے دیکھو</p>
</div>
</div>
<div class="card">
<div style="height:250px; background:#131316; border-radius:8px; display:flex; align-items:end; justify-content:space-around; padding:10px;" id="chart"></div>
</div>
<div class="card" style="display:flex; justify-content:space-between;">
<button class="btn btn-buy" onclick="trade('BUY')">BUY 📈</button>
<button class="btn btn-sell" onclick="trade('SELL')">SELL 📉</button>
</div>
<div class="card" id="result" style="display:none;"></div>
<script>
let prices=[1.1245,1.1240,1.1238,1.1232,1.1229,1.12267,1.1229,1.1231,1.1235,1.1238,1.1240];
let support=1.12290; let current=0;
let chartEl=document.getElementById('chart');
let priceEl=document.getElementById('price');
let statusEl=document.getElementById('status');
let hintEl=document.getElementById('hint');
function drawChart(){
 chartEl.innerHTML='';
 prices.forEach((p,i)=>{
   let h=50+(p-1.1226)*10000;
   let color=i>0&&p>prices[i-1]?'#00d084':'#ff4d4d';
   let div=document.createElement('div');
   div.style.width='6%'; div.style.height=h+'px'; div.style.background=color; div.style.borderRadius='3px';
   chartEl.appendChild(div);
 });
}
function update(){
 let p=prices[current%prices.length]+(Math.random()-0.5)*0.0002;
 priceEl.innerText=p.toFixed(5);
 let diff=p-support;
 if(diff<0.00015 && diff>-0.0001){
   statusEl.innerHTML='<span class="green">مارکیٹ زمین پر ہے - BUY کا سوچو</span>';
   hintEl.innerText='یہی وہ جگہ ہے جہاں سے مارکیٹ واپس مڑتی ہے';
 } else if(diff>0.0005){
   statusEl.innerHTML='<span class="red">مارکیٹ بہت اوپر ہے - انتظار کرو</span>';
   hintEl.innerText='اب Buy مت کرو';
 } else { statusEl.innerText='مارکیٹ دیکھ رہے ہیں...'; }
 current++; drawChart();
}
setInterval(update,1500); update();
function trade(type){
 let p=parseFloat(priceEl.innerText);
 let res=document.getElementById('result'); res.style.display='block';
 if(type=='BUY' && Math.abs(p-support)<0.0003){
   res.innerHTML='<h3 class="green">✅ بہترین فیصلہ!</h3><p>آپ نے Support سے BUY کیا۔ 5 منٹ میں پرافٹ بنتا۔</p>';
 } else if(type=='BUY'){
   res.innerHTML='<h3 class="red">⚠️ جلدی کر دی</h3><p>زمین کے قریب آنے کا انتظار کرو۔</p>';
 } else {
   res.innerHTML='<h3 class="red">❌ غلط جگہ SELL</h3><p>زمین پر کبھی Sell نہیں کرتے۔</p>';
 }
}
</script>
</body>
</html>
