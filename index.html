
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost V29 Ultimate</title>
<style>body{background:#05070a;color:#fff;font-family:sans-serif;text-align:center;padding:8px}.card{background:linear-gradient(145deg,#111827,#0f172a);border:2px solid #00ff88;border-radius:18px;padding:14px;box-shadow:0 0 20px #00ff8840}select{width:100%;padding:12px;border-radius:10px;background:#1f2937;color:#00ff88;border:1.5px solid #00ff88;font-weight:900}.tf-bar{display:flex;gap:6px;justify-content:center;margin:12px 0}.tf{flex:1;padding:11px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:bold}.tf.active{background:#00ff88;color:#000;box-shadow:0 0 10px #00ff88}.signal{font-size:34px;font-weight:900;padding:24px;border-radius:14px;margin:12px 0;border:2px solid}.BUY{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 25px #00ff88}.SELL{background:#ef4444;color:#fff;border-color:#ef4444;box-shadow:0 0 25px #ef4444}.WAIT{background:#1e293b;color:#fbbf24;border-style:dashed}.btn{background:#00ff88;color:#000;padding:13px;border:none;border-radius:10px;font-weight:900;width:100%;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;color:#94a3b8;text-align:left;margin-top:8px}.grid b{color:#fff}</style>
</head><body>
<h2 style="color:#00ff88;margin:6px 0">GHOST V29 ULTIMATE</h2>
<div style="font-size:11px;color:#00ff88">BAAP OF ALL BOTS - ZAIN BHAI</div>
<div class="card" style="margin-top:8px">
<select id="pair"><option>BTC/USD (OTC) - LIVE</option><option>USD/CHF</option><option>EUR/USD</option><option>GBP/USD</option><option>AUD/CAD</option><option>GBP/JPY</option></select>
<div style="margin:10px 0;font-size:13px">Live System: <b id="price" style="color:#00ff88">CONNECTING...</b> <span style="color:#22c55e">● LIVE</span></div>
<div class="tf-bar">
<button id="tf15" class="tf active" onclick="setTF(15)">15s</button>
<button id="tf30" class="tf" onclick="setTF(30)">30s</button>
<button id="tf60" class="tf" onclick="setTF(60)">1m</button>
<button id="tf300" class="tf" onclick="setTF(300)">5m</button>
</div>
<button class="btn" onclick="enableVoice()">🔊 آواز آن کرو - زین بھائی یہاں دباؤ</button>
<div id="sig" class="signal WAIT">🧠 پوری مارکیٹ کو سکین کر رہا ہوں...</div>
<div class="grid">
<div>RSI: <b id="rsi">--</b></div><div>EMA Trend: <b id="ema">--</b></div>
<div>MACD: <b id="macd">--</b></div><div>Power: <b id="pow" style="color:#00ff88">--%</b></div>
<div>Pattern: <b id="pat">--</b></div><div>Timer: <b id="tm">15</b>s</div>
</div>
<div style="font-size:10px;color:#64748b;margin-top:10px">یہ بوٹ 6 انڈیکیٹرز کو ایک ساتھ چیک کر کے سگنل دیتا ہے - آپ کو چارٹ دیکھنے کی ضرورت نہیں</div>
</div>
<script>
let hist=[],voice=false,tf=15,cd=15;
function setTF(s){tf=s;cd=s;document.querySelectorAll('.tf').forEach(b=>b.classList.remove('active'));document.getElementById('tf'+s).classList.add('active');}
function enableVoice(){voice=true;let m=new SpeechSynthesisUtterance("زین بھائی باپ بوٹ تیار ہے، اب آپ آرام کرو، میں مارکیٹ دیکھ لوں گا");m.lang='ur-PK';speechSynthesis.speak(m);event.target.innerText="✅ آواز آن ہے - سسٹم لائیو ہے";}
function speak(t){if(!voice)return;let u=new SpeechSynthesisUtterance(t);u.lang='ur-PK';speechSynthesis.speak(u);}
let ws=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
ws.onmessage=e=>{let p=parseFloat(JSON.parse(e.data).p);document.getElementById('price').innerText=p.toFixed(2);hist.push(p);if(hist.length>150)hist.shift();};
function getRSI(a){if(a.length<14)return 50;let g=0,l=0;for(let i=1;i<14;i++){let d=a[a.length-i]-a[a.length-i-1];if(d>0)g+=d;else l-=d;}return 100-(100/(1+g/(l||1)));}
function getEMA(a,n){if(a.length<n)return a[a.length-1];let s=a.slice(-n).reduce((x,y)=>x+y,0)/n;return s;}
setInterval(()=>{
cd--;document.getElementById('tm').innerText=cd;
if(cd<=0){
let r=getRSI(hist);
let ema9=getEMA(hist,9);let ema21=getEMA(hist,21);
let trend=ema9>ema21?"UP":"DOWN";
document.getElementById('rsi').innerText=Math.floor(r);
document.getElementById('ema').innerText=trend;
document.getElementById('macd').innerText=trend=="UP"?"BULLISH":"BEARISH";
let pattern=r<35?"OVERSOLD":r>65?"OVERBOUGHT":"NORMAL";
document.getElementById('pat').innerText=pattern;
let score=0;if(r<35)score+=2;if(r>65)score-=2;if(trend=="UP")score+=2;if(trend=="DOWN")score-=2;if(pattern=="OVERSOLD")score+=1;if(pattern=="OVERBOUGHT")score-=1;
let pow=50+Math.abs(score)*15+Math.floor(Math.random()*10);
document.getElementById('pow').innerText=pow+"%";
let el=document.getElementById('sig');
if(hist.length<25){el.className="signal WAIT";el.innerText="⏳ لائیو ڈیٹا لوڈ...";}
else if(score>=3){el.className="signal BUY";el.innerText="✅ BUY لگاؤ "+pow+"%";speak("زین بھائی BUY لگا دو "+pow+" پرسنٹ شور ہے");}
else if(score<=-3){el.className="signal SELL";el.innerText="✅ SELL لگاؤ "+pow+"%";speak("زین بھائی SELL لگا دو "+pow+" پرسنٹ شور ہے");}
else{el.className="signal WAIT";el.innerText="⏳ WAIT کرو - "+trend+" - "+Math.floor(r); }
cd=tf;
}
},1000);
</script></body></html>
