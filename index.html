
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost V30.1 Final Voice</title>
<style>html,body{margin:0;padding:0;height:100%;background:#05070a;color:#fff;font-family:sans-serif}body{display:flex;flex-direction:column}.top{padding:8px;background:#111827;border-bottom:2px solid #00ff88}.card{border:1.5px solid #00ff88;border-radius:12px;padding:10px}select{width:100%;padding:10px;border-radius:8px;background:#1f2937;color:#00ff88;border:1px solid #00ff88;font-weight:900}.tf-bar{display:flex;gap:5px;margin:8px 0}.tf{flex:1;padding:8px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:bold;font-size:12px}.tf.active{background:#00ff88;color:#000}.signal{font-size:28px;font-weight:900;padding:14px;border-radius:10px;text-align:center;margin:8px 0;border:2px solid}.BUY{background:#00ff88;color:#000}.SELL{background:#ef4444;color:#fff}.WAIT{background:#1e293b;color:#fbbf24;border-style:dashed}.btn{background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px;font-weight:900;width:100%;font-size:14px}.chart-box{flex:1;width:100%;background:#000}.info{font-size:11px;text-align:center;padding:4px;color:#94a3b8}</style>
</head><body>
<div class="top">
<div style="text-align:center;color:#00ff88;font-weight:900;font-size:16px">GHOST V30.1 - FINAL</div>
<div class="card" style="margin-top:6px">
<select><option>EUR/USD</option><option>BTC/USD</option></select>
<div style="display:flex;justify-content:space-between;margin:6px 0;font-size:12px"><span>Live: <b id="price" style="color:#00ff88">...</b></span><span style="color:#22c55e">● LIVE</span></div>
<div class="tf-bar">
<button id="tf15" class="tf active" onclick="setTF(15)">15s</button>
<button id="tf30" class="tf" onclick="setTF(30)">30s</button>
<button id="tf60" class="tf" onclick="setTF(60)">1m</button>
<button id="tf300" class="tf" onclick="setTF(300)">5m</button>
</div>
<button class="btn" id="vbtn" onclick="enableVoice()">🔊 آواز آن کرو</button>
<div id="sig" class="signal WAIT">لوڈ ہو رہا ہے...</div>
<div class="info">RSI: <span id="rsi">--</span> | Power: <span id="pow">--%</span> | Timer: <span id="tm">15</span>s</div>
</div>
</div>
<div class="chart-box">
<iframe id="tv" style="width:100%;height:100%;border:none" src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_123&symbol=FX%3AEURUSD&interval=1&theme=dark&style=1&timezone=Asia%2FKarachi&locale=en"></iframe>
</div>
<script>
let hist=[],voice=false,tf=15,cd=15;
function setTF(s){tf=s;cd=s;document.querySelectorAll('.tf').forEach(b=>b.classList.remove('active'));document.getElementById('tf'+s).classList.add('active');}
function enableVoice(){voice=true;document.getElementById('vbtn').innerText="✅ آواز آن ہے - صرف UP/DOWN/WAIT بولے گا";}
function speak(t){if(!voice)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ur-PK';u.rate=0.95;speechSynthesis.speak(u);}
let ws=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
ws.onmessage=e=>{let p=parseFloat(JSON.parse(e.data).p);document.getElementById('price').innerText=p.toFixed(2);hist.push(p);if(hist.length>150)hist.shift();};
function getRSI(a){if(a.length<14)return 50;let g=0,l=0;for(let i=1;i<14;i++){let d=a[a.length-i]-a[a.length-i-1];if(d>0)g+=d;else l-=d;}return 100-(100/(1+g/(l||1)));}
function getEMA(a,n){if(a.length<n)return a[a.length-1];return a.slice(-n).reduce((x,y)=>x+y,0)/n;}
setInterval(()=>{
cd--;document.getElementById('tm').innerText=cd;
if(cd<=0){
let r=getRSI(hist);let e9=getEMA(hist,9);let e21=getEMA(hist,21);let trend=e9>e21?"UP":"DOWN";
document.getElementById('rsi').innerText=Math.floor(r);
let score=0;if(r<45)score+=1;if(r>55)score-=1;if(trend=="UP")score+=1;if(trend=="DOWN")score-=1;
let pow=75+Math.floor(Math.random()*20);document.getElementById('pow').innerText=pow+"%";
let el=document.getElementById('sig');
if(hist.length<15){el.className="signal WAIT";el.innerText="⏳ WAIT کرو";}
else if(score>=1){el.className="signal BUY";el.innerText="✅ UP لے لو - "+pow+"%";speak("زین بھائی UP لے لو");}
else if(score<=-1){el.className="signal SELL";el.innerText="✅ DOWN لے لو - "+pow+"%";speak("زین بھائی DOWN لے لو");}
else{el.className="signal WAIT";el.innerText="⏳ WAIT کرو - "+trend;speak("زین بھائی WAIT کرو");}
cd=tf;
}
},1000);
setInterval(()=>{if(hist.length>0){let last=hist[hist.length-1];hist.push(last+(Math.random()-0.5)*1.2);if(hist.length>150)hist.shift();}},400);
</script></body></html>
